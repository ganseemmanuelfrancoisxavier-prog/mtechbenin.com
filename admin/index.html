<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MTECH BENIN — Administration</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #050505;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: #111;
      color: white;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
    }

    .login-logo {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .login-subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid #ddd;
      background: white;
      color: #111;
      padding: 14px;
      border-radius: 10px;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #111;
    }

    .btn {
      border: none;
      cursor: pointer;
      border-radius: 10px;
      padding: 13px 18px;
      font-weight: 700;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-black {
      width: 100%;
      background: white;
      color: #111;
      padding: 15px;
    }

    .btn-primary {
      background: #111;
      color: white;
    }

    .btn-secondary {
      background: #eee;
      color: #111;
    }

    .btn-danger {
      background: #111;
      color: white;
    }

    .error {
      color: #ff5c5c;
      margin-top: 15px;
      font-size: 14px;
    }

    /* =========================
       APP
    ========================= */

    #app {
      display: none;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 250px;
      background: #080808;
      color: white;
      padding: 25px 18px;
      z-index: 10;
    }

    .brand {
      font-size: 25px;
      font-weight: 900;
      padding: 10px 12px 30px;
    }

    .brand span {
      color: #aaa;
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-top: 4px;
    }

    .nav-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      color: #aaa;
      border: none;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: #202020;
      color: white;
    }

    .logout {
      position: absolute;
      bottom: 25px;
      left: 18px;
      right: 18px;
      background: #1b1b1b;
    }

    .main {
      margin-left: 250px;
      padding: 35px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .topbar h1 {
      font-size: 30px;
    }

    .user-info {
      color: #777;
      font-size: 14px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    /* =========================
       DASHBOARD
    ========================= */

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      border: 1px solid #e5e5e5;
    }

    .card-label {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 32px;
      font-weight: 800;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
    }

    .section-header h2 {
      font-size: 25px;
    }

    .search {
      width: 100%;
      max-width: 350px;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product-card {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      overflow: hidden;
    }

    .product-media {
      height: 220px;
      background: #eee;
      position: relative;
    }

    .product-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .no-image {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #888;
    }

    .product-info {
      padding: 18px;
    }

    .product-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .product-price {
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .product-meta {
      color: #777;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .product-actions {
      display: flex;
      gap: 8px;
    }

    .product-actions button {
      flex: 1;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .modal-box {
      width: 100%;
      max-width: 700px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      margin: 30px auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .close {
      border: none;
      background: #eee;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    .file-box {
      border: 2px dashed #ccc;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      background: #fafafa;
    }

    .file-box label {
      display: block;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .file-box input[type="file"] {
      width: 100%;
    }

    .preview {
      margin-top: 15px;
      display: none;
    }

    .preview img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    .preview video {
      width: 100%;
      max-height: 300px;
      border-radius: 12px;
      background: #000;
    }

    .upload-status {
      margin-top: 10px;
      color: #666;
      font-size: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 25px;
    }

    .empty {
      background: white;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 50px;
      text-align: center;
      color: #777;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #777;
    }

    .toast {
      position: fixed;
      right: 25px;
      bottom: 25px;
      background: #111;
      color: white;
      padding: 15px 20px;
      border-radius: 10px;
      display: none;
      z-index: 500;
      max-width: 350px;
    }

    .toast.show {
      display: block;
    }

    @media(max-width: 1000px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .cards {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media(max-width: 700px) {
      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
      }

      .logout {
        position: static;
        margin-top: 15px;
      }

      .main {
        margin-left: 0;
        padding: 20px;
      }

      .products-grid,
      .cards {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage">

  <div class="login-box">

    <div class="login-logo">
      MTECH BENIN
    </div>

    <div class="login-subtitle">
      Administration
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label>Email</label>
        <input
          id="loginEmail"
          type="email"
          placeholder="admin@mtechbenin.com"
          required
        >
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input
          id="loginPassword"
          type="password"
          placeholder="••••••••"
          required
        >
      </div>

      <button
        id="loginButton"
        class="btn btn-black"
        type="submit"
      >
        Se connecter
      </button>

      <div id="loginError" class="error"></div>

    </form>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app">

  <aside class="sidebar">

    <div class="brand">
      MTECH BENIN
      <span>Administration</span>
    </div>

    <button
      class="nav-btn active"
      data-section="dashboard"
    >
      📊 Tableau de bord
    </button>

    <button
      class="nav-btn"
      data-section="products"
    >
      📦 Produits
    </button>

    <button
      class="nav-btn"
      data-section="orders"
    >
      🛒 Commandes
    </button>

    <button
      class="nav-btn"
      data-section="settings"
    >
      ⚙️ Paramètres
    </button>

    <button
      id="logoutButton"
      class="nav-btn logout"
    >
      🚪 Déconnexion
    </button>

  </aside>


  <main class="main">

    <div class="topbar">

      <div>
        <h1 id="pageTitle">Tableau de bord</h1>
        <div id="userInfo" class="user-info"></div>
      </div>

    </div>


    <!-- =========================
         DASHBOARD
    ========================= -->

    <section
      id="dashboard"
      class="section active"
    >

      <div class="cards">

        <div class="card">
          <div class="card-label">
            Produits
          </div>

          <div
            id="dashboardProducts"
            class="card-value"
          >
            0
          </div>
        </div>


        <div class="card">
          <div class="card-label">
            Produits en stock
          </div>

          <div
            id="dashboardStock"
            class="card-value"
          >
            0
          </div>
        </div>


        <div class="card">
          <div class="card-label">
            Commandes
          </div>

          <div
            class="card-value"
          >
            0
          </div>
        </div>

      </div>

    </section>


    <!-- =========================
         PRODUCTS
    ========================= -->

    <section
      id="products"
      class="section"
    >

      <div class="section-header">

        <h2>Produits</h2>

        <button
          id="addProductButton"
          class="btn btn-primary"
        >
          + Ajouter un produit
        </button>

      </div>


      <div style="margin-bottom:20px">

        <input
          id="searchInput"
          class="search"
          type="search"
          placeholder="Rechercher un produit..."
        >

      </div>


      <div
        id="productsContainer"
        class="products-grid"
      >
        <div class="loading">
          Chargement...
        </div>
      </div>

    </section>


    <!-- =========================
         ORDERS
    ========================= -->

    <section
      id="orders"
      class="section"
    >

      <div class="empty">

        <h2>Commandes</h2>

        <p style="margin-top:10px">
          La gestion des commandes sera ajoutée prochainement.
        </p>

      </div>

    </section>


    <!-- =========================
         SETTINGS
    ========================= -->

    <section
      id="settings"
      class="section"
    >

      <div class="empty">

        <h2>Paramètres</h2>

        <p style="margin-top:10px">
          Les paramètres seront ajoutés prochainement.
        </p>

      </div>

    </section>

  </main>

</div>


<!-- =========================
     PRODUCT MODAL
========================= -->

<div
  id="productModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>Ajouter un produit</h2>

      <button
        id="closeModal"
        class="close"
        type="button"
      >
        ×
      </button>

    </div>


    <form id="productForm">

      <div class="form-group">

        <label>
          Nom du produit *
        </label>

        <input
          id="productName"
          type="text"
          placeholder="Ex. iPhone 15 Pro Max"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Prix (FCFA) *
        </label>

        <input
          id="productPrice"
          type="number"
          min="0"
          placeholder="500000"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Stock
        </label>

        <input
          id="productStock"
          type="number"
          min="0"
          value="0"
        >

      </div>


      <div class="form-group">

        <label>
          Catégorie
        </label>

        <input
          id="productCategory"
          type="text"
          placeholder="Ex. iPhone"
        >

      </div>


      <!-- =========================
           PHOTO
      ========================= -->

      <div class="file-box">

        <label>
          📷 Photo du produit
        </label>

        <input
          id="productImage"
          type="file"
          accept="image/*"
        >

        <div
          id="imagePreview"
          class="preview"
        >
          <img
            id="imagePreviewImg"
            alt="Aperçu"
          >
        </div>

        <div
          id="imageStatus"
          class="upload-status"
        ></div>

      </div>


      <!-- =========================
           VIDEO
      ========================= -->

      <div class="file-box">

        <label>
          🎥 Vidéo du produit
        </label>

        <input
          id="productVideo"
          type="file"
          accept="video/*"
        >

        <div
          id="videoPreview"
          class="preview"
        >
          <video
            id="videoPreviewPlayer"
            controls
          ></video>
        </div>

        <div
          id="videoStatus"
          class="upload-status"
        ></div>

      </div>


      <div class="form-group">

        <label>
          Description
        </label>

        <textarea
          id="productDescription"
          rows="5"
          placeholder="Description du produit..."
        ></textarea>

      </div>


      <div class="modal-actions">

        <button
          id="cancelProduct"
          class="btn btn-secondary"
          type="button"
        >
          Annuler
        </button>

        <button
          id="saveProduct"
          class="btn btn-primary"
          type="submit"
        >
          Enregistrer
        </button>

      </div>

    </form>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script type="module">

  /* =====================================================
     SUPABASE
  ===================================================== */

  import {
    createClient
  } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


  /*
    IMPORTANT :

    Garde ton Project URL.
    Garde ta Publishable Key actuelle.

    NE METS JAMAIS ta Secret Key ici.
  */

  const SUPABASE_URL =
    "https://eldbudjhbsnvuffjpiue.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_u8yaezMW2z78tLG7DnIe3g_kjVQIlde";


  const supabase =
    createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const loginPage =
    document.getElementById("loginPage");

  const app =
    document.getElementById("app");

  const loginForm =
    document.getElementById("loginForm");

  const loginEmail =
    document.getElementById("loginEmail");

  const loginPassword =
    document.getElementById("loginPassword");

  const loginButton =
    document.getElementById("loginButton");

  const loginError =
    document.getElementById("loginError");

  const logoutButton =
    document.getElementById("logoutButton");

  const userInfo =
    document.getElementById("userInfo");

  const productModal =
    document.getElementById("productModal");

  const productForm =
    document.getElementById("productForm");

  const productsContainer =
    document.getElementById("productsContainer");

  const searchInput =
    document.getElementById("searchInput");

  const addProductButton =
    document.getElementById("addProductButton");

  const closeModal =
    document.getElementById("closeModal");

  const cancelProduct =
    document.getElementById("cancelProduct");

  const productImage =
    document.getElementById("productImage");

  const productVideo =
    document.getElementById("productVideo");

  const imagePreview =
    document.getElementById("imagePreview");

  const imagePreviewImg =
    document.getElementById("imagePreviewImg");

  const videoPreview =
    document.getElementById("videoPreview");

  const videoPreviewPlayer =
    document.getElementById("videoPreviewPlayer");

  const imageStatus =
    document.getElementById("imageStatus");

  const videoStatus =
    document.getElementById("videoStatus");

  const saveProduct =
    document.getElementById("saveProduct");

  const toast =
    document.getElementById("toast");


  let products = [];


  /* =====================================================
     TOAST
  ===================================================== */

  function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

      toast.classList.remove("show");

    }, 3500);

  }


  /* =====================================================
     NAVIGATION
  ===================================================== */

  document
    .querySelectorAll(".nav-btn[data-section]")
    .forEach(button => {

      button.addEventListener("click", () => {

        const sectionName =
          button.dataset.section;


        document
          .querySelectorAll(".nav-btn[data-section]")
          .forEach(btn => {

            btn.classList.remove("active");

          });


        button.classList.add("active");


        document
          .querySelectorAll(".section")
          .forEach(section => {

            section.classList.remove("active");

          });


        document
          .getElementById(sectionName)
          .classList.add("active");


        const titles = {

          dashboard:
            "Tableau de bord",

          products:
            "Produits",

          orders:
            "Commandes",

          settings:
            "Paramètres"

        };


        document.getElementById("pageTitle")
          .textContent =
          titles[sectionName] || "Administration";

      });

    });


  /* =====================================================
     LOGIN
  ===================================================== */

  loginForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      loginError.textContent = "";

      loginButton.disabled = true;

      loginButton.textContent =
        "Connexion...";


      const email =
        loginEmail.value.trim();

      const password =
        loginPassword.value;


      const {
        data,
        error
      } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        loginError.textContent =
          error.message;

        loginButton.disabled = false;

        loginButton.textContent =
          "Se connecter";

        return;

      }


      if (data.user) {

        showApp(data.user);

      }

    }
  );


  /* =====================================================
     SESSION
  ===================================================== */

  async function checkSession() {

    const {
      data
    } =
      await supabase.auth.getSession();


    if (data.session?.user) {

      showApp(data.session.user);

    } else {

      showLogin();

    }

  }


  supabase.auth.onAuthStateChange(
    (event, session) => {

      if (session?.user) {

        showApp(session.user);

      }

    }
  );


  function showLogin() {

    loginPage.style.display =
      "flex";

    app.style.display =
      "none";

  }


  async function showApp(user) {

    loginPage.style.display =
      "none";

    app.style.display =
      "block";


    userInfo.textContent =
      user.email || "";


    await loadProducts();

  }


  /* =====================================================
     LOGOUT
  ===================================================== */

  logoutButton.addEventListener(
    "click",
    async () => {

      await supabase.auth.signOut();

      showLogin();

    }
  );


  /* =====================================================
     MODAL
  ===================================================== */

  function openModal() {

    productModal.classList.add("show");

    productForm.reset();

    imagePreview.style.display =
      "none";

    videoPreview.style.display =
      "none";

    imageStatus.textContent =
      "";

    videoStatus.textContent =
      "";

  }


  function closeProductModal() {

    productModal.classList.remove("show");

  }


  addProductButton.addEventListener(
    "click",
    openModal
  );


  closeModal.addEventListener(
    "click",
    closeProductModal
  );


  cancelProduct.addEventListener(
    "click",
    closeProductModal
  );


  /* =====================================================
     IMAGE PREVIEW
  ===================================================== */

  productImage.addEventListener(
    "change",
    () => {

      const file =
        productImage.files[0];


      if (!file) {

        imagePreview.style.display =
          "none";

        return;

      }


      if (!file.type.startsWith("image/")) {

        imageStatus.textContent =
          "Veuillez sélectionner une image.";

        productImage.value = "";

        return;

      }


      const url =
        URL.createObjectURL(file);


      imagePreviewImg.src =
        url;

      imagePreview.style.display =
        "block";

      imageStatus.textContent =
        file.name;

    }
  );


  /* =====================================================
     VIDEO PREVIEW
  ===================================================== */

  productVideo.addEventListener(
    "change",
    () => {

      const file =
        productVideo.files[0];


      if (!file) {

        videoPreview.style.display =
          "none";

        return;

      }


      if (!file.type.startsWith("video/")) {

        videoStatus.textContent =
          "Veuillez sélectionner une vidéo.";

        productVideo.value = "";

        return;

      }


      const url =
        URL.createObjectURL(file);


      videoPreviewPlayer.src =
        url;

      videoPreview.style.display =
        "block";

      videoStatus.textContent =
        file.name;

    }
  );


  /* =====================================================
     UPLOAD FILE
  ===================================================== */

  async function uploadFile(file, folder) {

    if (!file) {

      return null;

    }


    const {
      data: sessionData
    } =
      await supabase.auth.getSession();


    const user =
      sessionData.session?.user;


    if (!user) {

      throw new Error(
        "Session administrateur expirée."
      );

    }


    const cleanName =
      file.name
        .toLowerCase()
        .replace(/[^a-z0-9.-]/g, "-");


    const uniqueName =
      Date.now()
      + "-"
      + Math.random()
          .toString(36)
          .substring(2, 9)
      + "-"
      + cleanName;


    const path =
      user.id
      + "/"
      + folder
      + "/"
      + uniqueName;


    const {
      error
    } =
      await supabase.storage
        .from("products")
        .upload(
          path,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );


    if (error) {

      throw error;

    }


    const {
      data
    } =
      supabase.storage
        .from("products")
        .getPublicUrl(path);


    return data.publicUrl;

  }


  /* =====================================================
     ADD PRODUCT
  ===================================================== */

  productForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      saveProduct.disabled =
        true;

      saveProduct.textContent =
        "Enregistrement...";


      imageStatus.textContent =
        "";

      videoStatus.textContent =
        "";


      try {

        const name =
          document
            .getElementById("productName")
            .value
            .trim();


        const price =
          Number(
            document
              .getElementById("productPrice")
              .value
          );


        const stock =
          Number(
            document
              .getElementById("productStock")
              .value || 0
          );


        const category =
          document
            .getElementById("productCategory")
            .value
            .trim();


        const description =
          document
            .getElementById("productDescription")
            .value
            .trim();


        /* =========================
           IMAGE
        ========================= */

        let imageUrl = null;


        if (productImage.files[0]) {

          imageStatus.textContent =
            "Téléversement de la photo...";


          imageUrl =
            await uploadFile(
              productImage.files[0],
              "images"
            );


          imageStatus.textContent =
            "✓ Photo envoyée";

        }


        /* =========================
           VIDEO
        ========================= */

        let videoUrl = null;


        if (productVideo.files[0]) {

          videoStatus.textContent =
            "Téléversement de la vidéo...";


          videoUrl =
            await uploadFile(
              productVideo.files[0],
              "videos"
            );


          videoStatus.textContent =
            "✓ Vidéo envoyée";

        }


        /* =========================
           DATABASE
        ========================= */

        const payload = {

          name,

          price,

          stock,

          category:
            category || null,

          image_url:
            imageUrl,

          video_url:
            videoUrl,

          description:
            description || null,

          active:
            true

        };


        const {
          error
        } =
          await supabase
            .from("products")
            .insert(payload);


        if (error) {

          throw error;

        }


        showToast(
          "Produit ajouté avec succès."
        );


        closeProductModal();


        await loadProducts();

      } catch (error) {

        console.error(error);


        showToast(
          "Erreur : " +
          (error.message || "Impossible d'ajouter le produit.")
        );

      } finally {

        saveProduct.disabled =
          false;

        saveProduct.textContent =
          "Enregistrer";

      }

    }
  );


  /* =====================================================
     LOAD PRODUCTS
  ===================================================== */

  async function loadProducts() {

    productsContainer.innerHTML =
      `<div class="loading">Chargement...</div>`;


    const {
      data,
      error
    } =
      await supabase
        .from("products")
        .select(
          "id,created_at,name,price,stock,category,image_url,video_url,description,active"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      productsContainer.innerHTML =
        `<div class="empty">
          Erreur lors du chargement des produits.
        </div>`;

      console.error(error);

      return;

    }


    products =
      data || [];


    updateDashboard();


    renderProducts();

  }


  /* =====================================================
     DASHBOARD
  ===================================================== */

  function updateDashboard() {

    document.getElementById(
      "dashboardProducts"
    ).textContent =
      products.length;


    const stock =
      products.reduce(
        (total, product) =>
          total +
          Number(product.stock || 0),
        0
      );


    document.getElementById(
      "dashboardStock"
    ).textContent =
      stock;

  }


  /* =====================================================
     RENDER PRODUCTS
  ===================================================== */

  function renderProducts() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();


    const filtered =
      products.filter(product => {

        const text =
          (
            product.name +
            " " +
            (product.category || "")
          )
          .toLowerCase();


        return text.includes(search);

      });


    if (!filtered.length) {

      productsContainer.innerHTML =
        `<div class="empty">
          Aucun produit trouvé.
        </div>`;

      return;

    }


    productsContainer.innerHTML =
      filtered
        .map(product => {

          const image =
            product.image_url
              ? `
                <img
                  src="${escapeHtml(product.image_url)}"
                  alt="${escapeHtml(product.name)}"
                >
              `
              : `
                <div class="no-image">
                  Aucune image
                </div>
              `;


          return `

            <div class="product-card">

              <div class="product-media">

                ${image}

              </div>

              <div class="product-info">

                <div class="product-name">
                  ${escapeHtml(product.name)}
                </div>

                <div class="product-price">
                  ${formatPrice(product.price)} FCFA
                </div>

                <div class="product-meta">

                  Stock :
                  ${Number(product.stock || 0)}

                  ${
                    product.category
                      ? " • " +
                        escapeHtml(product.category)
                      : ""
                  }

                </div>

                <div class="product-actions">

                  <button
                    class="btn btn-secondary"
                    onclick="viewProductVideo(${product.id})"
                  >
                    🎥 Vidéo
                  </button>

                </div>

              </div>

            </div>

          `;

        })
        .join("");

  }


  /* =====================================================
     SEARCH
  ===================================================== */

  searchInput.addEventListener(
    "input",
    renderProducts
  );


  /* =====================================================
     VIDEO
  ===================================================== */

  window.viewProductVideo =
    function(id) {

      const product =
        products.find(
          item =>
            Number(item.id) ===
            Number(id)
        );


      if (!product) {

        return;

      }


      if (!product.video_url) {

        showToast(
          "Ce produit n'a pas encore de vidéo."
        );

        return;

      }


      window.open(
        product.video_url,
        "_blank"
      );

    };


  /* =====================================================
     HELPERS
  ===================================================== */

  function formatPrice(value) {

    return Number(value || 0)
      .toLocaleString("fr-FR");

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =====================================================
     START
  ===================================================== */

  checkSession();

</script>

</body>
</html>
